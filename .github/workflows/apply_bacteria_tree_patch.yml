name: Apply bacteria decision-tree patch

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/bacteria-tree-part01.txt'
      - '.github/patches/bacteria-tree-retry02.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified source files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          parts = [Path(f'.github/patches/bacteria-tree-part{i:02d}.txt').read_text() for i in range(1, 9)]
          encoded = ''.join(parts)
          expected_encoded = '561adc6643aac5a6c5fc8a59744c06173d895eaa9f05bb45048318f4286c1f94'
          expected_json = '26d0f7caf64c831913b13b49f4af147188a3beeeaa34dd67343816231a3ff3c4'
          if hashlib.sha256(encoded.encode()).hexdigest() != expected_encoded:
              raise SystemExit('Payload base64 checksum mismatch; refusing to modify repository files.')
          raw = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha256(raw).hexdigest() != expected_json:
              raise SystemExit('Payload JSON checksum mismatch; refusing to modify repository files.')
          data = json.loads(raw.decode('utf-8'))
          if len(data) != 17:
              raise SystemExit(f'Unexpected file count: {len(data)}')
          for filename, content in data.items():
              path = Path(filename)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'Unsafe payload path: {filename}')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          print(f'Reconstructed {len(data)} verified files.')
          PY

      - name: Apply signed-cookie test correction and category guard
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          views_path = Path('core/views.py')
          tests_path = Path('core/test_decision_tree.py')
          if digest(views_path) != 'c9f9e32175e0911559f735fa0b9c28559ef35bca31e69ce1789b9e15ea5ab7bb':
              raise SystemExit('Unexpected pre-patch views.py; refusing correction.')
          if digest(tests_path) != '5ed679530064e0684d0b376d06dbabb5af802a0b9911180a0f8074febc9912a4':
              raise SystemExit('Unexpected pre-patch test_decision_tree.py; refusing correction.')

          views = views_path.read_text()
          old = """    case, encounter = _student_case(request, case_id, Encounter.Mode.TREE)\n    if case.category != ClinicalCase.Category.BACTERIA:\n        messages.info(request, 'A árvore decisória está disponível apenas para bactérias nesta etapa.')\n        return redirect('dashboard')\n\n    tree = get_tree(case)\n"""
          new = """    case = get_object_or_404(ClinicalCase, id=case_id, active=True)\n    if case.category != ClinicalCase.Category.BACTERIA:\n        messages.info(request, 'A árvore decisória está disponível apenas para bactérias nesta etapa.')\n        return redirect('dashboard')\n    _, encounter = _student_case(request, case_id, Encounter.Mode.TREE)\n\n    tree = get_tree(case)\n"""
          if views.count(old) != 1:
              raise SystemExit('Category-guard patch target not found exactly once.')
          views_path.write_text(views.replace(old, new), encoding='utf-8')

          tests = tests_path.read_text()
          old1 = """    def test_best_path_completes_with_100(self):\n        session = self.client.session\n        session[\"study_mode\"] = Encounter.Mode.TREE\n        session.save()\n\n        tree = get_tree(self.case)\n"""
          new1 = """    def _select_tree_mode(self):\n        response = self.client.post(reverse(\"study_mode\"), {\"mode\": Encounter.Mode.TREE})\n        self.assertRedirects(response, reverse(\"dashboard\"))\n\n    def test_best_path_completes_with_100(self):\n        self._select_tree_mode()\n\n        tree = get_tree(self.case)\n"""
          old2 = """    def test_tree_route_blocks_non_bacterial_case(self):\n        fungi = make_case(order=2, category=ClinicalCase.Category.FUNGI)\n        session = self.client.session\n        session[\"study_mode\"] = Encounter.Mode.TREE\n        session.save()\n        response = self.client.get(reverse(\"decision_tree_case\", args=[fungi.id]))\n"""
          new2 = """    def test_tree_route_blocks_non_bacterial_case(self):\n        fungi = make_case(order=2, category=ClinicalCase.Category.FUNGI)\n        self._select_tree_mode()\n        response = self.client.get(reverse(\"decision_tree_case\", args=[fungi.id]))\n"""
          if tests.count(old1) != 1 or tests.count(old2) != 1:
              raise SystemExit('Signed-cookie test patch targets not found exactly once.')
          tests_path.write_text(tests.replace(old1, new1).replace(old2, new2), encoding='utf-8')

          if digest(views_path) != '8004849f89f1b98d93275afa2715f585e298fa719fb2f7a1eda6409c739e8535':
              raise SystemExit('Post-patch views.py checksum mismatch.')
          if digest(tests_path) != 'eb61e939e4ea20d7b03ecc944d109f3b476ec1339770ea04c8cb73751faf731d':
              raise SystemExit('Post-patch test_decision_tree.py checksum mismatch.')
          print('Validated correction applied.')
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate implementation
        run: |
          python -m py_compile core/models.py core/views.py core/urls.py core/admin.py core/decision_trees.py core/migrations/0003_decision_tree_mode.py core/test_decision_tree.py
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md core templates static
          git commit -m 'Add AI-independent bacteria decision trees'
          git push origin HEAD:main
